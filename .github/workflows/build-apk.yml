name: Build Android APK
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: flutter pub get
        working-directory: humsukhan
      - run: flutter build apk --release
        working-directory: humsukhan
      - uses: actions/upload-artifact@v4
        with:
          name: humsukhan-release-apk
          path: humsukhan/build/app/outputs/flutter-apk/app-release.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.1-build.${{ github.run_number }}
          name: HumSukhan v2.1.1 build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: humsukhan/build/app/outputs/flutter-apk/app-release.apk
