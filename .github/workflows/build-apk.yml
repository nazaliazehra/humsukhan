name: Build Android APK

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: flutter pub get
        working-directory: humsukhan

      - name: Build release APK
        run: flutter build apk --release
        working-directory: humsukhan

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: humsukhan-release-apk
          path: humsukhan/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.1-supabase.${{ github.run_number }}
          name: HumSukhan v2.1.1 — Supabase Connected
          prerelease: false
          generate_release_notes: true
          files: humsukhan/build/app/outputs/flutter-apk/app-release.apk
